<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body class="layout-{{ page.layout | default: 'page' }}{% if page.body_class %} {{ page.body_class }}{% endif %}">
  <a class="skip-link" href="#content">Skip to content</a>
  {% include sidebar.html %}
  <div class="main" id="main">
    {% include nav.html %}
    <main id="content" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  {% include lightbox.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {%- if page.scripts %}{% for s in page.scripts %}
  <script src="{{ s | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {%- endfor %}{% endif %}
</body>
</html>
