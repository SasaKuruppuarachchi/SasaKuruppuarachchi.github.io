---
layout: default
---
<section class="post">
  {% if page.tags %}
  <header class="major">
    <p>
      {% for tag in page.tags %}
        <span class="label">#{{ tag }}</span>
      {% endfor %}
    </p>
  </header>
  {% endif %}

  <div class="content">
    {{ content }}
  </div>

  <ul class="actions">
    <li><a href="{{ site.baseurl }}/" class="button">← Back to Home</a></li>
  </ul>
</section>
