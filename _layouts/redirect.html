<!doctype html>
{%- assign target = page.redirect_to | relative_url -%}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Redirecting…" | strip_html }}</title>
  <link rel="canonical" href="{{ target }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ target }}">
  <script>location.replace({{ target | jsonify }});</script>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.5 -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", Roboto, sans-serif; }
    a { color: #0a84ff; }
  </style>
</head>
<body>
  <p>Opening <a href="{{ target }}">{{ page.title | default: target | strip_html }}</a>…</p>
</body>
</html>
