name: Update Publications
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install requests
      - name: Fetch ORCID publications
        env:
          ORCID_ID: 0000-0002-4530-8725
          ORCID_FETCH_DETAILS: 1
        run: python scripts/fetch_orcid.py || echo "ORCID fetch failed; keeping existing publications.json"
      - name: Commit changes
        run: |
          if git diff --quiet data/publications.json; then
            echo "No publication changes"; exit 0; fi
          git config user.name 'github-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add data/publications.json
          git commit -m 'chore: update publications.json (auto)'
          git push
