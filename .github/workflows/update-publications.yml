name: Update publications & videos
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install requests
      - name: Fetch ORCID publications
        env:
          ORCID_ID: 0000-0002-4530-8725
          ORCID_FETCH_DETAILS: 1
        run: python scripts/fetch_orcid.py || echo "ORCID fetch failed; keeping existing _data/orcid.json"
      - name: Fetch latest YouTube videos
        run: python scripts/fetch_youtube.py
      - name: Commit changes
        run: |
          if git diff --quiet -- _data/; then
            echo "No changes"; exit 0; fi
          git config user.name 'github-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add _data/orcid.json _data/videos.json
          git commit -m 'chore: refresh ORCID publications and YouTube videos (auto)'
          git push
