<section class="section" id="gallery" data-toc="Gallery">
  <div class="section__head">
    <div>
      <h2 class="section__title">Gallery</h2>
      <p class="section__sub">Selected shoots, shared on Facebook.</p>
    </div>
  </div>
  <div class="photo-list" id="photo-posts-list" aria-live="polite"></div>
</section>

<script>
  /*
   * Photography posts. Each entry: { url: 'public Facebook post/album URL', title?: '', date?: 'YYYY-MM-DD' }.
   * Dated posts are shown newest first; undated ones follow in list order.
   */
  window.PHOTO_POSTS = [
    { url: 'https://www.facebook.com/EmashaSeneviratneOfficial/posts/pfbid09RUHu6RymYJTV8vwgpKuV3qgYPJjR2ZiVrWWBHA8aEQySUFJ3752AvdshD9XynDvl' },
    { url: 'https://www.facebook.com/permalink.php?story_fbid=pfbid0R3v1k16HPpaEZQPYX58WZXfmZCERSuKRJ5bGckHEfwdErYMeR2CSyeKTj9CfNpJSl&id=100008540473940' },
    { url: 'https://www.facebook.com/permalink.php?story_fbid=pfbid02ZsteJ82fzxPNfC8XjAwuSGbXR2uVDHvx7nM9o44CAeE1BkhFMdXdf9Bew354peChl&id=100008540473940' },
    { url: 'https://www.facebook.com/permalink.php?story_fbid=pfbid04xeGemi7XkdoDA5RhXaeNHTjePBg4swjTA38CETCSTPtPoWXKaBBDXPXRomN1G4ml&id=100008540473940' },
    { url: 'https://www.facebook.com/permalink.php?story_fbid=pfbid02h5HuNidJEK4G8xTa6dpof3zFoLknRnqDTTurNNGhkkmmbRnurC3QVstQG1urVK6Jl&id=100008540473940' },
    { url: 'https://www.facebook.com/permalink.php?story_fbid=pfbid02ek6BTpGJuZNnc344p5VH6D2qDG3Sf4N9LPAqRruq9UEphoMy8pV5D3hnYV6W4X24l&id=100008540473940' },
    { url: 'https://www.facebook.com/permalink.php?story_fbid=pfbid0wNCSLBxsz6nurZdfyT5puFeNWYN6rt9sPjSgoVQWx8YnM8HCC2a4beGDPcfgFuyNl&id=100008540473940' },
    { url: 'https://www.facebook.com/permalink.php?story_fbid=pfbid027WJ1JKa9R95owaNF44E3vCUwoNSjaPJDr2HMXdWkZ12tDT14UVTnXUNbW2t9vba2l&id=100008540473940' },
    { url: 'https://www.facebook.com/primalki.teshara/posts/pfbid021FVs4HywDBzoLkydGLNUQ6PuMiKSczdS9qa1vJB5PZ5LG2KdYn2MzUe5eFfM2qzkl' }
  ];

  (function () {
    var list = document.getElementById('photo-posts-list');
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var posts = window.PHOTO_POSTS.slice().sort(function (a, b) {
      if (!a.date && !b.date) return 0; if (!a.date) return 1; if (!b.date) return -1;
      return new Date(b.date) - new Date(a.date);
    });
    list.innerHTML = posts.map(function (p) {
      return '<article class="photo-post reveal">' +
        (p.title ? '<h3 class="card__title" style="margin:6px 8px 10px">' + esc(p.title) + '</h3>' : '') +
        '<div class="fb-post" data-href="' + esc(p.url) + '" data-width="500" data-show-text="true">' +
        '<a class="photo-post__fallback" href="' + esc(p.url) + '" target="_blank" rel="noopener">View on Facebook ↗</a></div>' +
        '</article>';
    }).join('');

    /* Load the Facebook SDK only when the gallery is about to scroll into view. */
    function loadSdk() {
      if (document.getElementById('facebook-jssdk')) return;
      var root = document.createElement('div'); root.id = 'fb-root'; document.body.appendChild(root);
      var s = document.createElement('script');
      s.id = 'facebook-jssdk'; s.async = true; s.defer = true; s.crossOrigin = 'anonymous';
      s.src = 'https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v19.0';
      document.body.appendChild(s);
    }
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { if (es.some(function (e) { return e.isIntersecting; })) { loadSdk(); io.disconnect(); } }, { rootMargin: '400px' });
      io.observe(list);
    } else { loadSdk(); }
  })();
</script>
