		<script>
		/*
		 * Photography posts data.
		 *
		 * Each entry accepts:
		 *   url   {string}  – Public Facebook post or album URL to embed (required).
		 *   title {string}  – Optional human-readable title shown above the embed.
		 *   date  {string}  – Optional forced date ("YYYY-MM-DD").
		 *                     When omitted the Facebook widget's own date is shown
		 *                     inside the embed; for sorting those posts fall to the end.
		 *
		 * Posts are sorted newest-first by default.
		 */
		var PHOTO_POSTS = [
			{
				url:   'https://www.facebook.com/EmashaSeneviratneOfficial/posts/pfbid09RUHu6RymYJTV8vwgpKuV3qgYPJjR2ZiVrWWBHA8aEQySUFJ3752AvdshD9XynDvl',
			},
			{
				url:   'https://www.facebook.com/permalink.php?story_fbid=pfbid0R3v1k16HPpaEZQPYX58WZXfmZCERSuKRJ5bGckHEfwdErYMeR2CSyeKTj9CfNpJSl&id=100008540473940',
			},
			{
				url:   'https://www.facebook.com/permalink.php?story_fbid=pfbid02ZsteJ82fzxPNfC8XjAwuSGbXR2uVDHvx7nM9o44CAeE1BkhFMdXdf9Bew354peChl&id=100008540473940',
			},
			{
				url:   'https://www.facebook.com/permalink.php?story_fbid=pfbid04xeGemi7XkdoDA5RhXaeNHTjePBg4swjTA38CETCSTPtPoWXKaBBDXPXRomN1G4ml&id=100008540473940',
			},
			{
				url:   'https://www.facebook.com/permalink.php?story_fbid=pfbid02h5HuNidJEK4G8xTa6dpof3zFoLknRnqDTTurNNGhkkmmbRnurC3QVstQG1urVK6Jl&id=100008540473940',
			},
			{
				url:   'https://www.facebook.com/permalink.php?story_fbid=pfbid02ek6BTpGJuZNnc344p5VH6D2qDG3Sf4N9LPAqRruq9UEphoMy8pV5D3hnYV6W4X24l&id=100008540473940',
			},
			{
				url:   'https://www.facebook.com/permalink.php?story_fbid=pfbid0wNCSLBxsz6nurZdfyT5puFeNWYN6rt9sPjSgoVQWx8YnM8HCC2a4beGDPcfgFuyNl&id=100008540473940',
			},
			{
				url:   'https://www.facebook.com/permalink.php?story_fbid=pfbid027WJ1JKa9R95owaNF44E3vCUwoNSjaPJDr2HMXdWkZ12tDT14UVTnXUNbW2t9vba2l&id=100008540473940',
			},
			{
				url:   'https://www.facebook.com/primalki.teshara/posts/pfbid021FVs4HywDBzoLkydGLNUQ6PuMiKSczdS9qa1vJB5PZ5LG2KdYn2MzUe5eFfM2qzkl',
			}
		];

		/* ── helpers ── */

		function escapeHtml(str) {
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;');
		}

		function formatDate(iso) {
			if (!iso) return '';
			var d = new Date(iso);
			if (isNaN(d.getTime())) return iso;
			return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
		}

		/* ── render ── */

		function renderPosts(order) {
			var posts = PHOTO_POSTS.slice();

			/* Sort: posts with an explicit date come first (or last for oldest),
			   posts without a date always go to the end of the list. */
			posts.sort(function(a, b) {
				var hasA = !!a.date, hasB = !!b.date;
				if (!hasA && !hasB) return 0;
				if (!hasA) return 1;   // undated always sinks to bottom
				if (!hasB) return -1;
				var da = new Date(a.date), db = new Date(b.date);
				return order === 'oldest' ? da - db : db - da;
			});

			var html = '';
			posts.forEach(function(post, idx) {
				html += '<article class="photo-post" id="photo-post-' + idx + '">';

				if (post.title || post.date) {
					html += '<div class="post-meta">';
					if (post.title) {
						html += '<h3 class="post-title">' + escapeHtml(post.title) + '</h3>';
					}
					if (post.date) {
						html += '<span class="post-date">' + escapeHtml(formatDate(post.date)) + '</span>';
					}
					html += '</div>';
				}

				html += '<div class="fb-embed-wrapper">';
				html += '<div class="fb-post"'
					+ ' data-href="' + escapeHtml(post.url) + '"'
					+ ' data-width="500"'
					+ ' data-show-text="true">'
					+ '</div>';
				html += '</div>';

				html += '</article>';
			});

			var container = document.getElementById('photo-posts-list');
			container.innerHTML = html;

			/* Ask the Facebook SDK to parse and render the newly inserted widgets. */
			if (window.FB && window.FB.XFBML) {
				window.FB.XFBML.parse(container);
			}
		}

		/* ── init ── */

		document.addEventListener('DOMContentLoaded', function() {
			renderPosts('newest');

			document.getElementById('sort-order').addEventListener('change', function() {
				renderPosts(this.value);
			});

			/* If the FB SDK loads after DOMContentLoaded, re-parse when it's ready. */
			window.fbAsyncInit = (function(prev) {
				return function() {
					if (prev) prev();
					if (window.FB) {
						window.FB.init({ xfbml: true, version: 'v18.0' });
						var container = document.getElementById('photo-posts-list');
						if (container && container.children.length) {
							window.FB.XFBML.parse(container);
						}
					}
				};
			}(window.fbAsyncInit));
		});

		/* ── Sidebar scrollspy (mirrors other pages) ── */
		(function(){
			var mq = window.matchMedia('(min-width: 981px)');
			if (!mq.matches) return;
			var header  = document.getElementById('header');
			var tagline = header && header.querySelector('.sidebar-tagline');
			var toc     = document.getElementById('sidebar-sections');
			var start = 60, end = 240;

			function onScroll() {
				if (!tagline) return;
				var y = window.pageYOffset || document.documentElement.scrollTop || 0;
				var t = y <= start ? 0 : y >= end ? 1 : (y - start) / (end - start);
				tagline.style.transform = 'translateY(' + (-12 * t) + 'px)';
				tagline.style.opacity   = String(1 - t);
				tagline.classList.toggle('is-hidden', t >= 0.999);
				if (toc) {
					toc.style.transform = 'translateY(' + (16 * (1 - t)) + 'px)';
					toc.style.opacity   = String(0.2 + 0.8 * t);
				}
			}
			onScroll();
			window.addEventListener('scroll', onScroll, { passive: true });

			var ids   = ['photography', 'posts'];
			var links = ids.reduce(function(acc, id) {
				var a = document.querySelector('#sidebar-sections a[href="#' + id + '"]');
				if (a) acc[id] = a;
				return acc;
			}, {});

			Object.keys(links).forEach(function(id) {
				links[id].addEventListener('click', function(ev) {
					ev.preventDefault();
					var target = document.querySelector(this.getAttribute('href'));
					if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
				});
			});

			function setActive(id) {
				ids.forEach(function(k) {
					var link = links[k];
					if (!link) return;
					var on = (k === id);
					link.classList.toggle('active', on);
					link.style.opacity = on ? '1' : '0.4';
				});
			}

			if ('IntersectionObserver' in window) {
				var obs = new IntersectionObserver(function(entries) {
					entries.forEach(function(e) {
						if (e.isIntersecting && e.target.id) setActive(e.target.id);
					});
				}, { rootMargin: '0px 0px -85% 0px', threshold: [0, 0.01, 0.1] });
				ids.forEach(function(id) {
					var el = document.getElementById(id);
					if (el) obs.observe(el);
				});
			} else {
				function compute() {
					var vh = window.innerHeight || document.documentElement.clientHeight;
					var trigger = vh * 0.85, best = null, bestDist = 1e9;
					ids.forEach(function(id) {
						var el = document.getElementById(id);
						if (!el) return;
						var d = Math.abs(el.getBoundingClientRect().top - trigger);
						if (d < bestDist) { bestDist = d; best = id; }
					});
					if (best) setActive(best);
				}
				compute();
				window.addEventListener('scroll', compute, { passive: true });
				window.addEventListener('resize', compute);
			}

			function checkBottom() {
				var doc = document.documentElement, body = document.body;
				var y    = window.pageYOffset || doc.scrollTop || 0;
				var vh   = window.innerHeight  || doc.clientHeight || 0;
				var full = Math.max(doc.scrollHeight, body.scrollHeight,
				                    doc.offsetHeight,  body.offsetHeight);
				if (y + vh >= full - 2) setActive('posts');
			}
			checkBottom();
			window.addEventListener('scroll',  checkBottom, { passive: true });
			window.addEventListener('resize',  checkBottom);
		}());
		</script>
